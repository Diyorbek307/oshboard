# Конфигурация для деплоя на Render.com (https://render.com)
# Render прочитает этот файл и сам поднимет сервис.
services:
  - type: web
    name: oshboard
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Логин тоже НЕ пишем здесь: этот файл лежит в открытом репозитории,
      # и половина пары «логин-пароль» подсказывала бы, что подбирать.
      - key: ADMIN_USER
        sync: false          # задаётся вручную в панели Render
      - key: ADMIN_PASSWORD
        sync: false          # задаётся вручную в панели Render (секрет)
      - key: SESSION_SECRET
        generateValue: true  # Render сгенерирует случайно
      - key: LEAD_TO
        value: diyorbekmustafaev7@gmail.com
